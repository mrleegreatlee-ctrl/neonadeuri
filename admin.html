<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>너나들이 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* 너나들이 관리자 웹 admin v1.1 — 2026-10-29 (신고 처리 추가)
   원칙 P-1: 기억의 제목·본문·장소·사진은 서버가 보내지 않는다. 이 화면도 그리지 않는다. */
:root{
  color-scheme:light;
  --bg:#F5F1EB; --surface:#FFFFFF; --surface-2:#FBF7F1; --line:#E8DCC8; --line-soft:#F0E8DA;
  --ink:#3D3929; --ink-2:#6B6452; --ink-3:#A99A82;
  --accent:#C96342; --accent-track:#F3DCD2; --accent-wash:rgba(201,99,66,.10);
  --ok:#4F7F52; --ok-bg:#EAF3EA; --warn:#B5472A; --warn-bg:#FBEDE8; --hold:#7B6CC4;
  --shadow:0 1px 2px rgba(61,57,41,.06);
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#171512; --surface:#211F1B; --surface-2:#282520; --line:#3A352D; --line-soft:#2E2A24;
    --ink:#EFE9DD; --ink-2:#C7BEAE; --ink-3:#8F8574;
    --accent:#D4714D; --accent-track:#4A2F25; --accent-wash:rgba(212,113,77,.14);
    --ok:#7DB580; --ok-bg:#24301F; --warn:#E07A5C; --warn-bg:#3A231B;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#171512; --surface:#211F1B; --surface-2:#282520; --line:#3A352D; --line-soft:#2E2A24;
  --ink:#EFE9DD; --ink-2:#C7BEAE; --ink-3:#8F8574;
  --accent:#D4714D; --accent-track:#4A2F25; --accent-wash:rgba(212,113,77,.14);
  --ok:#7DB580; --ok-bg:#24301F; --warn:#E07A5C; --warn-bg:#3A231B;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.6 'Malgun Gothic','Apple SD Gothic Neo','Gowun Dodum',sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:'Gowun Batang',serif;font-weight:700;margin:0}
.hidden{display:none!important}
.muted{color:var(--ink-3)}
.sub{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

/* 로그인 */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:360px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:var(--shadow)}
.login-card h1{font-size:22px;margin-bottom:4px}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);outline:none}
.inp:focus{border-color:var(--accent)}
.btn{padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.good{color:var(--ok);border-color:var(--ok)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:12.5px;margin-top:10px;min-height:1.2em}
.msg.err{color:var(--warn)}

/* 앱 틀 */
#app{display:grid;grid-template-columns:200px 1fr;min-height:100%}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
nav.side .brand{font-family:'Gowun Batang',serif;font-weight:700;font-size:17px;padding:4px 10px 14px}
nav.side .brand small{display:block;font-family:'Gowun Dodum',sans-serif;font-weight:400;font-size:11px;color:var(--ink-3)}
.tab{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:9px 10px;border:0;border-radius:8px;background:transparent;cursor:pointer;color:var(--ink-2)}
.tab:hover{background:var(--surface-2)}
.tab.on{background:var(--accent-wash);color:var(--ink);font-weight:700}
.tab .pill{font-size:11px;color:var(--ink-3)}
nav.side .foot{margin-top:auto;font-size:11.5px;color:var(--ink-3);padding:10px;line-height:1.5;word-break:break-all}
main{padding:22px 28px 60px;min-width:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.top h2{font-size:20px;margin-right:auto}
.demo-flag{font-size:12px;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:1px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.card h3{font-size:15px;margin-bottom:2px}
.card .desc{font-size:12px;color:var(--ink-3);margin-bottom:12px}
.grid{display:grid;gap:14px}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.mt{margin-top:14px}

/* 숫자 타일 */
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.tile .l{font-size:12px;color:var(--ink-2)}
.tile .v{font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .d{font-size:12px;color:var(--ink-3);margin-top:2px}
.tile.alert .v{color:var(--warn)}

/* 차트 */
.chart-wrap{position:relative}
.chart-title{font-size:12.5px;color:var(--ink-2);margin-bottom:2px}
.chart-total{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg.chart .grid-line{stroke:var(--line-soft);stroke-width:1}
svg.chart .axis-t{fill:var(--ink-3);font-size:10px}
svg.chart .bar{fill:var(--accent)}
svg.chart .bar.hov{opacity:.75}
svg.chart .hit{fill:transparent;cursor:default}
.tip{position:fixed;pointer-events:none;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.tip strong{display:block;font-size:14px}
.linkbtn{border:0;background:none;color:var(--ink-2);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}

/* 흐름 막대 */
.funnel-row{display:grid;grid-template-columns:120px 1fr 110px;gap:10px;align-items:center;padding:5px 0}
.funnel-track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.funnel-fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.funnel-row .val{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px}
.meter{height:12px;background:var(--accent-track);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.meter > div{height:100%;background:var(--accent);border-radius:6px 0 0 6px}

/* 표 */
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.controls .inp{width:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line-soft);text-align:left;white-space:nowrap}
table.t th{font-size:12px;color:var(--ink-2);font-weight:700;background:var(--surface-2);position:sticky;top:0}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover td{background:var(--surface-2)}
table.t tbody tr.sel td{background:var(--accent-wash)}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px}
.status::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ok)}
.status.s-suspended{color:var(--warn)}
.status.s-suspended::before{background:var(--warn)}
.status.s-admin::before{background:var(--hold)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:12.5px}
.users-layout{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
.detail .row{display:grid;grid-template-columns:84px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.detail .row .k{color:var(--ink-3)}
.detail .counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.detail .counts div{background:var(--surface-2);border-radius:8px;padding:8px;text-align:center}
.detail .counts b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.detail .counts span{font-size:11.5px;color:var(--ink-3)}
.notice{font-size:12px;color:var(--ink-3);line-height:1.6}
.empty{padding:30px;text-align:center;color:var(--ink-3)}
.list-item{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.list-item:last-child{border-bottom:0}
.kv{font-size:12px;color:var(--ink-3)}
.loading{opacity:.5;transition:opacity .2s}
.tab .pill.hot{color:#fff;background:var(--warn);border-radius:999px;padding:0 7px;font-weight:700}
.rep{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.rep-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.rep-head .reason{font-weight:700}
.badge{display:inline-block;font-size:11.5px;border-radius:999px;padding:1px 9px;border:1px solid var(--line);color:var(--ink-2)}
.badge.open{border-color:var(--warn);color:var(--warn)}
.badge.done{border-color:var(--ok);color:var(--ok)}
.rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rep-box{background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:13px}
.rep-box .k{font-size:11.5px;color:var(--ink-3);margin-bottom:2px}
.rep-ev{border:1px dashed var(--accent);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:13px}
.rep-ev .k{font-size:11.5px;color:var(--accent);margin-bottom:4px}
.rep-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.rep-act .inp{flex:1;min-width:220px}
@media (max-width:760px){ .rep-grid{grid-template-columns:1fr} }

@media (max-width:1100px){
  .g6{grid-template-columns:repeat(3,minmax(0,1fr))}
  .users-layout{grid-template-columns:1fr}
}
@media (max-width:760px){
  #app{grid-template-columns:1fr}
  nav.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}
  nav.side .foot{display:none}
  main{padding:16px}
  .g3,.g2{grid-template-columns:1fr}
  .g6{grid-template-columns:repeat(2,minmax(0,1fr))}
  .table-scroll{overflow-x:auto}
}
</style>
</head>
<body>

<section id="login" class="hidden">
  <div class="login-card">
    <h1>너나들이 관리</h1>
    <div class="muted" style="font-size:12.5px">관리자 계정으로 로그인하십시오.</div>
    <form id="loginForm" autocomplete="on">
      <label class="field"><span>이메일</span><input class="inp" id="lgEmail" type="email" autocomplete="username" required></label>
      <label class="field"><span>비밀번호</span><input class="inp" id="lgPw" type="password" autocomplete="current-password" required></label>
      <button class="btn pri" type="submit" style="width:100%">로그인</button>
    </form>
    <div class="msg" id="lgMsg"></div>
    <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:12px">
      <button class="btn sm" id="btnDemo" type="button">예시 데이터로 미리보기</button>
      <div class="notice" style="margin-top:6px">서버 연결 없이 화면 구성만 확인합니다. 실제 사용자 정보는 표시되지 않습니다.</div>
    </div>
  </div>
</section>

<div id="app" class="hidden">
  <nav class="side">
    <div class="brand">너나들이 관리<small>admin v1.1</small></div>
    <button class="tab" data-tab="dash" type="button">현황</button>
    <button class="tab" data-tab="users" type="button">사용자</button>
    <button class="tab" data-tab="reports" type="button">신고 <span class="pill" id="repPill"></span></button>
    <button class="tab" data-tab="notices" type="button">공지</button>
    <button class="tab" data-tab="audit" type="button">작업 기록</button>
    <div class="foot"><div id="whoami"></div><button class="linkbtn" id="btnLogout" type="button">로그아웃</button></div>
  </nav>
  <main>
    <div class="top">
      <h2 id="pageTitle">현황</h2>
      <span class="demo-flag hidden" id="demoFlag">예시 데이터</span>
      <span class="muted" style="font-size:12px" id="updatedAt"></span>
      <button class="btn sm" id="btnRefresh" type="button">새로고침</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="tip hidden" id="tip"></div>

<script>
(function(){
'use strict';
var SUPABASE_URL='https://hivjguqfcobvwljstjzt.supabase.co';
var SUPABASE_KEY='sb_publishable_C-OVfBVJcI5nFrRO0ps6EA_y0OMGWjQ';
var FREE_STORAGE_BYTES=1024*1024*1024;   // 무료 요금제 저장 용량 가정값 (Supabase 요금 페이지에서 확인 필요)

var sb=null, DEMO=false, me=null, tab='dash';
try{ if(window.supabase&&window.supabase.createClient)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }catch(e){ sb=null; }

// ── DOM 도우미: 사용자 데이터는 textContent로만 넣는다 ──
function el(tag,attrs,kids){
  var n=document.createElement(tag);
  if(attrs)Object.keys(attrs).forEach(function(k){
    var v=attrs[k]; if(v==null||v===false)return;
    if(k==='text')n.textContent=v;
    else if(k==='class')n.className=v;
    else if(k.slice(0,2)==='on')n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v);
  });
  (kids||[]).forEach(function(c){ if(c==null)return; n.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return n;
}
var SVGNS='http://www.w3.org/2000/svg';
function sv(tag,attrs){ var n=document.createElementNS(SVGNS,tag); Object.keys(attrs||{}).forEach(function(k){n.setAttribute(k,attrs[k])}); return n; }
function fmtN(v){ v=Number(v)||0; return v.toLocaleString('ko-KR'); }
function fmtBytes(b){ b=Number(b)||0; if(b<1024)return b+' B'; if(b<1048576)return (b/1024).toFixed(1)+' KB'; if(b<1073741824)return (b/1048576).toFixed(1)+' MB'; return (b/1073741824).toFixed(2)+' GB'; }
function p2(n){return String(n).padStart(2,'0')}
function fmtDT(v){ if(!v)return '-'; var d=new Date(v); if(isNaN(d))return '-'; return d.getFullYear()+'.'+p2(d.getMonth()+1)+'.'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes()); }
function fmtD(v){ if(!v)return '-'; var d=new Date(v); if(isNaN(d))return '-'; return d.getFullYear()+'.'+p2(d.getMonth()+1)+'.'+p2(d.getDate()); }
function pct(a,b){ return b>0?Math.round(a/b*100):0; }
var FN_SQL={admin_get_dashboard:'DB-04',admin_list_users:'DB-04',admin_get_user:'DB-04',
  admin_list_reports:'DB-05',admin_resolve_report:'DB-05',admin_count_open_reports:'DB-05',
  admin_find_user:'DB-03a',admin_set_user_status:'DB-03a',admin_list_audit:'DB-03a',nnd_is_admin:'DB-03a',admin_broadcast_notice:'DB-03b'};
function errText(e){
  var m=String((e&&(e.message||e.error_description))||e||'');
  var f=m.match(/Could not find the function public\.([a-z_]+)/i);
  if(f)return '서버에 '+f[1]+' 함수가 없습니다. '+(FN_SQL[f[1]]?FN_SQL[f[1]]+' SQL을 먼저 실행하십시오.':'해당 SQL을 먼저 실행하십시오.');
  if(/JWT expired|invalid jwt|not authenticated/i.test(m))return '로그인이 만료되었습니다. 다시 로그인하십시오.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return '서버에 연결하지 못했습니다. 인터넷 연결을 확인하십시오.';
  if(/permission denied/i.test(m))return '권한이 없습니다. 관리자 계정인지 확인하십시오.';
  if(/Invalid login credentials/i.test(m))return '이메일 또는 비밀번호가 맞지 않습니다.';
  if(/Email not confirmed/i.test(m))return '이메일 인증이 끝나지 않은 계정입니다.';
  if(/schema cache/i.test(m))return '서버 설정이 아직 반영되지 않았습니다. 잠시 뒤 새로고침하십시오.';
  return m;
}
var ACTION_LABEL={find_user:'사용자 조회 (이메일)',view_user:'사용자 상세 조회',list_users:'사용자 목록 조회',suspend:'계정 정지',unsuspend:'정지 해제',
  view_signup_stats:'가입 현황 조회',view_etc_regions:'데이터 점검',broadcast_notice:'공지 발송',
  list_reports:'신고 목록 조회',resolve_report:'신고 처리'};
var REASON_LABEL={spam:'광고·스팸',offensive:'불쾌하거나 부적절한 내용',harassment:'괴롭힘·원치 않는 연락',other:'기타'};
var REP_STATUS={open:'처리 전',dismissed:'기각',warned:'경고',suspended:'계정 정지'};
var RESOLVE_LABEL={dismiss:'기각',warn:'경고',suspend:'계정 정지'};

// ── 서버 호출 (예시 모드면 예시 데이터) ──
async function rpc(fn,args){
  if(DEMO)return demoRpc(fn,args||{});
  var r=await sb.rpc(fn,args||{});
  if(r.error)throw r.error;
  return r.data;
}

// ── 로그인 ──
var $=function(id){return document.getElementById(id)};
function showLogin(msg,isErr){ $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('lgMsg').textContent=msg||''; $('lgMsg').className='msg'+(isErr?' err':''); }
async function enterApp(){
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('demoFlag').classList.toggle('hidden',!DEMO);
  $('whoami').textContent=DEMO?'예시 관리자':(me&&me.email||'');
  go(tab);
  refreshOpenCount();
}
async function checkAdminAndEnter(user){
  me=user;
  try{
    var ok=await rpc('nnd_is_admin');
    if(ok!==true){ await sb.auth.signOut(); showLogin('관리자 권한이 없는 계정입니다.',true); return; }
    enterApp();
  }catch(e){ showLogin('권한 확인 실패: '+errText(e),true); }
}
$('loginForm').addEventListener('submit',async function(ev){
  ev.preventDefault();
  if(!sb){ showLogin('서버 연결 도구를 불러오지 못했습니다. 인터넷 연결을 확인하십시오.',true); return; }
  $('lgMsg').textContent='확인 중'; $('lgMsg').className='msg';
  var r=await sb.auth.signInWithPassword({email:$('lgEmail').value.trim(),password:$('lgPw').value});
  if(r.error){ showLogin('로그인 실패: '+errText(r.error),true); return; }
  checkAdminAndEnter(r.data.user);
});
$('btnDemo').addEventListener('click',function(){ DEMO=true; enterApp(); });
$('btnLogout').addEventListener('click',async function(){
  if(!DEMO&&sb)await sb.auth.signOut();
  DEMO=false; me=null; showLogin('로그아웃했습니다.');
});
$('btnRefresh').addEventListener('click',function(){ go(tab); refreshOpenCount(); });
var OPEN_REPORTS=null;   // null: 아직 모름 또는 DB-05 미반영
async function refreshOpenCount(){

function niceMax(m){ if(m<=4)return 4; var p=Math.pow(10,Math.floor(Math.log10(m))); var s=[1,2,2.5,5,10]; for(var i=0;i<s.length;i++){ if(s[i]*p>=m)return s[i]*p; } return 10*p; }
function colChart(trend,key,title,unit){
  var W=320,H=150,L=26,R=6,T=10,B=22, n=trend.length||1;
  var vals=trend.map(function(r){return Number(r[key])||0});
  var total=vals.reduce(function(a,b){return a+b},0);
  var max=niceMax(Math.max.apply(null,vals.concat([0])));
  var band=(W-L-R)/n, bw=Math.min(24,band*0.62);
  var svg=sv('svg',{class:'chart',viewBox:'0 0 '+W+' '+H,role:'img','aria-label':title+' 최근 14일, 합계 '+total+unit});
  [0,max/2,max].forEach(function(t){
    var y=T+(H-T-B)*(1-t/max);
    svg.appendChild(sv('line',{class:'grid-line',x1:L,x2:W-R,y1:y,y2:y}));
    var lb=sv('text',{class:'axis-t',x:L-5,y:y+3,'text-anchor':'end'}); lb.textContent=fmtN(Math.round(t)); svg.appendChild(lb);
  });
  vals.forEach(function(v,i){
    var x=L+band*i+(band-bw)/2, h=(H-T-B)*(v/max), y=H-B-h, r=Math.min(4,h,bw/2);
    if(h>0){
      var d='M'+x+','+(H-B)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+bw-r)+'Q'+(x+bw)+','+y+' '+(x+bw)+','+(y+r)+'V'+(H-B)+'Z';
      var bar=sv('path',{class:'bar',d:d}); bar.dataset.i=i; svg.appendChild(bar);
    }
    var hit=sv('rect',{class:'hit',x:L+band*i,y:T,width:band,height:H-T-B,tabindex:0});
    var label=trend[i]?trend[i].date.slice(5).replace('-','/'):'';
    function show(ev){ var b=svg.querySelector('.bar[data-i="'+i+'"]'); if(b)b.classList.add('hov'); tipShow(ev,fmtN(v)+unit,title+' · '+label); }
    function hide(){ var b=svg.querySelector('.bar[data-i="'+i+'"]'); if(b)b.classList.remove('hov'); tipHide(); }
    hit.addEventListener('pointermove',show); hit.addEventListener('pointerleave',hide);
    hit.addEventListener('focus',function(){ var bb=hit.getBoundingClientRect(); show({clientX:bb.left+bb.width/2,clientY:bb.top}); }); hit.addEventListener('blur',hide);
    svg.appendChild(hit);
  });
  [0,Math.floor((n-1)/2),n-1].forEach(function(i){
    if(!trend[i])return;
    var t=sv('text',{class:'axis-t',x:L+band*i+band/2,y:H-6,'text-anchor':'middle'}); t.textContent=trend[i].date.slice(5).replace('-','/'); svg.appendChild(t);
  });
  return el('div',{class:'chart-wrap'},[el('div',{class:'chart-title',text:title}),el('div',{class:'chart-total',text:fmtN(total)+unit}),svg]);
}
function tipShow(ev,val,lab){

  t.classList.remove('hidden');
  var x=Math.min(ev.clientX+12,window.innerWidth-t.offsetWidth-8), y=Math.max(8,ev.clientY-t.offsetHeight-10);
  t.style.left=x+'px'; t.style.top=y+'px';

function reportCard(r){

    ev=el('div',{class:'notice',style:'margin-top:10px',text:r.evidence_consent?'첨부는 처리 후 삭제되었습니다.':'첨부 없음 · 기억 내용은 관리 도구에서 볼 수 없습니다.'});
  }
  var kids=[head,el('div',{class:'rep-grid'},[target,reporter]),ev];

    var canAct=!r.target_is_admin;
    var act=el('div',{class:'rep-act'},[note,
      el('button',{class:'btn sm',type:'button',text:'기각',onclick:function(){ resolveReport(r,'dismiss',note); }}),
      el('button',{class:'btn sm',type:'button',text:'경고',disabled:canAct?null:'disabled',onclick:function(){ resolveReport(r,'warn',note); }}),
      el('button',{class:'btn sm danger',type:'button',text:'계정 정지',disabled:(canAct&&r.target_status!=='suspended')?null:'disabled',onclick:function(){ resolveReport(r,'suspend',note); }})
    ]);
    kids.push(act);
    if(r.target_is_admin)kids.push(el('div',{class:'notice',style:'margin-top:6px',text:'관리자 계정은 경고·정지할 수 없습니다. 기각만 가능합니다.'}));
    else if(r.target_status==='suspended')kids.push(el('div',{class:'notice',style:'margin-top:6px',text:'이미 정지된 계정입니다. 기각 또는 경고로 정리하십시오.'}));
  }else if(r.resolution_note){
    kids.push(el('div',{class:'kv',style:'margin-top:10px',text:'처리 사유: '+r.resolution_note}));
  }
  return el('div',{class:'rep'},kids);
}
async function resolveReport(r,action,noteEl){
  var note=noteEl.value.trim();
  if(action!=='dismiss'&&!note){ noteEl.focus(); noteEl.style.borderColor='var(--warn)'; return; }
  var msg={dismiss:'이 신고를 기각하시겠습니까?',
    warn:'대상자에게 경고를 보내시겠습니까?\n대상자가 다음에 앱을 열 때 사유가 표시됩니다.',
    suspend:'대상 계정을 정지하시겠습니까?\n정지되면 기록 보기와 삭제만 가능합니다.'}[action];
  if(note)msg+='\n\n사유: '+note;
  msg+='\n\n처리하면 이 신고의 첨부는 삭제되고 되돌릴 수 없습니다.';
  if(!window.confirm(msg))return;
  try{
    await rpc('admin_resolve_report',{p_report:r.id,p_action:action,p_note:note});
    go('reports'); refreshOpenCount();
  }catch(e){ window.alert('처리 실패: '+errText(e)); }
}
